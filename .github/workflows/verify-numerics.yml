name: Verify modular gap and AGM laws
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  numerical-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mpmath
        run: python -m pip install "mpmath>=1.3,<2"
      - name: Execute committed numerical verification script
        run: python scripts/verify_modular_gap_law.py --precision 400 --outdir outputs
      - name: Upload verification data
        uses: actions/upload-artifact@v4
        with:
          name: modular-gap-agm-verification
          path: outputs/
